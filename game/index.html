<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neon Bay — An Open-World Crime Story</title>
<meta name="description" content="Neon Bay: explore a sun-soaked coastal city on foot and by car, steal cars, outrun the police, and run five story missions for Rosa Delgado.">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #14081f; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: crosshair; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" aria-label="Neon Bay: an open-world crime game. Drive and walk around a coastal city, steal cars, take on missions, and outrun the police."></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
